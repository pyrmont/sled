name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Sled
        uses: actions/checkout@v4
        with:
          path: sled
      - name: Check out Wattle
        uses: actions/checkout@v4
        with:
          repository: pyrmont/wattle
          path: wattle
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build Wattle
        run: zig build
        working-directory: wattle
      - name: Build Sled
        run: ../wattle/zig-out/bin/wattle -p ../wattle/zig-out build exe
        working-directory: sled
      - name: Build native module
        run: ../wattle/zig-out/bin/wattle -p ../wattle/zig-out build lib
        working-directory: sled
      - name: Run Wattle tests
        run: ../wattle/zig-out/bin/wattle test
        working-directory: sled
