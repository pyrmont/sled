name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag to release
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos-aarch64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-latest
            target: freebsd14-x86_64
            triple: x86_64-freebsd
            vm-arch: x86-64
          - os: ubuntu-latest
            target: freebsd14-aarch64
            triple: aarch64-freebsd
            vm-arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Sled
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          path: sled
      - name: Check out Wattle
        uses: actions/checkout@v4
        with:
          repository: pyrmont/wattle
          path: wattle
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build Wattle
        run: zig build
        working-directory: wattle
      - name: Build Sled
        run: ../wattle/zig-out/bin/wattle -p ../wattle/zig-out build exe --release fast ${{ matrix.triple && format('-t {0}', matrix.triple) || '' }}
        working-directory: sled
      - name: Check Sled
        if: ${{ !matrix.triple }}
        run: zig-out/bin/sled --help
        working-directory: sled
      - name: Check Sled on FreeBSD
        if: ${{ matrix.triple }}
        uses: cross-platform-actions/action@v0.27.0
        with:
          operating_system: freebsd
          architecture: ${{ matrix.vm-arch }}
          version: "14.0"
          shell: bash
          run: sled/zig-out/bin/sled --help
      - name: Package Sled
        run: |
          package="sled-${{ inputs.version }}"
          mkdir "$package"
          cp zig-out/bin/sled man/man1/sled.1 LICENSE README.md "$package/"
          tar -czf "${package}-${{ matrix.target }}.tar.gz" "$package"
        working-directory: sled
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: sled/sled-${{ inputs.version }}-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          merge-multiple: true
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ./artifacts/*
          overwrite_files: false
          tag_name: ${{ inputs.version }}
